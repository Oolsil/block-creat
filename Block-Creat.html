<style>

:root[data-theme="dark"]{--rim1:#5f84ff;--rim2:#2e44b8;--rim3:#3a2a9a;--bg1:#2447b8;--bg2:#0b1650;--board:#0c1238;--cell:#18235e;--panel:#17215a;--ptext:#eef2ff;--shadow:rgba(0,0,0,.5)}
html{height:100%;background:var(--bg2);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(circle at 50% 55%,rgba(120,220,255,.28),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff;font-family:Rubik,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.app{height:100%;max-width:440px;margin:0 auto;padding:10px 14px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.top{width:100%;display:flex;align-items:center;justify-content:space-between}
.best{display:flex;align-items:center;gap:6px;font-weight:800;font-size:24px;color:#ffd93d;text-shadow:0 2px 0 rgba(0,30,100,.45)}
.btn{width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 0 var(--shadow);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.scorewrap{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score{font-size:60px;font-weight:800;line-height:1;display:flex}
.score span{display:inline-block;background:linear-gradient(180deg,#fffbb0,#8dffb0 50%,#46dcff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,40,130,.55))}
.score span.dg{animation:dg .3s cubic-bezier(.2,1.6,.4,1)}
.score.hot{animation:hot .8s ease-out,hue 1.2s linear}
.combo{font-weight:800;font-size:17px;color:#ffe45e;height:22px;opacity:0;transition:opacity .3s;text-shadow:0 2px 0 rgba(120,40,0,.55)}
.combo.on{opacity:1}.combo.pulse{animation:cp .45s cubic-bezier(.2,1.6,.4,1)}
.frame{position:relative;width:min(100%,50vh);padding:16px;box-sizing:border-box;border-radius:28px;background:linear-gradient(155deg,var(--rim1),var(--rim2) 55%,var(--rim3));box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,20,.3),inset 0 0 0 2px rgba(255,255,255,.18),0 14px 30px var(--shadow),0 0 40px rgba(80,200,255,.25)}
.frame.shake{animation:shake .4s}
.lights{position:absolute;inset:8px;pointer-events:none}
.bulb{--bc:#8dffb0;position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--bc);box-shadow:0 0 8px 2px var(--bc);animation:blink 1.4s ease-in-out infinite}
.bulb:nth-child(3n+1){--bc:#ffe45e}.bulb:nth-child(3n+2){--bc:#ff8ad8}
.lights.hot .bulb{animation:blink .25s ease-in-out infinite,hue .6s linear infinite}
.flash{position:absolute;inset:0;border-radius:28px;background:#fff;pointer-events:none;z-index:7;animation:fl2 .45s ease-out forwards}
.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:6px;box-sizing:border-box;width:100%;aspect-ratio:1;background:var(--board);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--board),#4f6cff 22%),var(--board) 75%);border-radius:16px;box-shadow:inset 0 4px 12px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.35),0 2px 0 rgba(255,255,255,.35);transition:filter .8s}
.board::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.14) 50%,transparent 62%) 0 0/250% 100%,linear-gradient(160deg,rgba(255,255,255,.08),transparent 30%);animation:sweep 7s ease-in-out infinite}
.board.dead{filter:grayscale(.85) brightness(.75)}
.c{background:var(--cell);border-radius:6px;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.07)}
.c:not(.f):not(.ghost):nth-child(even){background:color-mix(in srgb,var(--cell),#fff 6%)}
.b1{--k:#ff4b4b}.b2{--k:#ff9a1f}.b3{--k:#ffd93d}.b4{--k:#38d97a}.b5{--k:#2fb7ff}.b6{--k:#9a63ff}.b7{--k:#ff6fcf}
.f{background:var(--k);box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -3px 0 rgba(0,0,0,.3)}
.f{background:linear-gradient(145deg,color-mix(in srgb,var(--k),#fff 28%),var(--k) 60%,color-mix(in srgb,var(--k),#000 18%));box-shadow:inset 2px 2px 0 color-mix(in srgb,var(--k),#fff 55%),inset -2px -3px 0 color-mix(in srgb,var(--k),#000 32%)}
.f::after{content:"";position:absolute;inset:20%;border-radius:3px;background:linear-gradient(145deg,rgba(255,255,255,.3),rgba(0,0,0,.1))}
.c.ghost{background:var(--k);opacity:.6;box-shadow:0 0 12px var(--k),inset 0 0 0 2px rgba(255,255,255,.5)}.c.ghost::after{display:none}
.c.wc{box-shadow:inset 0 0 0 3px rgba(255,255,255,.95);filter:brightness(1.25)}
.drop{animation:drop .3s ease-out;z-index:1}
.clr{animation:clr .5s ease-in forwards;animation-delay:var(--d,0ms);z-index:2}
.pt{position:absolute;border-radius:2px;pointer-events:none;z-index:3}
.tray{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{height:112px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-radius:20px;cursor:grab;touch-action:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,20,90,.25),0 4px 10px var(--shadow)}
.pc{display:grid;pointer-events:none}
.pc div{border-radius:5px;position:relative}
.pc.enter{animation:enter .5s cubic-bezier(.2,1.5,.4,1) backwards}
.slot.lifted .pc{opacity:.2;transform:scale(.85)}
.slot.back .pc{animation:enter .35s cubic-bezier(.2,1.5,.4,1)}
.drag{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:grid;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35));will-change:transform;margin:0}
.drag div{border-radius:5px;position:relative}
.float{position:absolute;z-index:6;pointer-events:none;font-weight:800;font-size:28px;color:#fff;text-shadow:0 3px 0 rgba(0,30,100,.55),0 0 14px rgba(255,255,255,.6);transform:translate(-50%,-50%);animation:fl 1.1s ease-out forwards;white-space:nowrap}
.float.big{font-size:40px;color:#ffe45e;text-shadow:0 4px 0 rgba(150,50,0,.6),0 0 18px #ff9a1f}
.float.combo{color:#ff8a5c;font-size:34px}
.over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,40,.6);backdrop-filter:blur(4px);z-index:60}
.over.show{display:flex;animation:fade .3s}
.card{background:var(--panel);color:var(--ptext);padding:26px 30px;border-radius:26px;text-align:center;width:min(86vw,340px);box-sizing:border-box;animation:pop .45s ease-out;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.card h2{margin:0 0 6px;font-size:28px;font-weight:800}
.card p{margin:4px 0;opacity:.7}
.card .big{font-size:50px;font-weight:800;margin:6px 0}
.card .rec{color:#e58a00;font-weight:700;display:none;opacity:1}
.play{margin-top:14px;border:0;border-radius:16px;padding:13px 28px;font:700 18px Rubik,system-ui,sans-serif;color:#fff;background:linear-gradient(145deg,#38d97a,#16b4d8);box-shadow:0 4px 0 rgba(0,40,90,.35);cursor:pointer}
.play.alt{background:linear-gradient(145deg,#ff9a1f,#ff4b6e);margin-top:8px;font-size:15px;padding:10px 22px}
.play:active{transform:translateY(2px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 0;text-align:left;font-weight:500}
.row.col{flex-direction:column;align-items:stretch;gap:5px;padding:5px 0}
input[type=range]{width:100%;accent-color:#2fb7ff;height:24px}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:#8b98c9;position:relative;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.sw:checked{background:#38d97a}.sw:checked::after{transform:translateX(20px)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:scale(1.4);filter:brightness(1.7)}55%{transform:scale(.88);filter:brightness(1.25)}100%{transform:scale(1);filter:none}}
@keyframes clr{0%{transform:scale(1);filter:brightness(1)}30%{transform:scale(1.2);filter:brightness(2.4)}100%{transform:scale(0) rotate(30deg);opacity:0}}
@keyframes enter{0%{transform:translateY(30px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes lift{0%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes dg{0%{transform:translateY(-55%) scale(1.35);opacity:.2}100%{transform:none;opacity:1}}
@keyframes hot{0%{transform:scale(1)}30%{transform:scale(var(--s,1.3)) rotate(-3deg)}60%{transform:scale(var(--s,1.3)) rotate(3deg)}100%{transform:scale(1)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes cp{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes blink{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes fl{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}20%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
@keyframes fl2{0%{opacity:.5}100%{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sweep{0%,55%{background-position:120% 0,0 0}100%{background-position:-120% 0,0 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}

:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg1:#4f64d8;--bg2:#27338f;--board:#1c2670;--cell:#27348a;--panel:#1f2c7e;--ptext:#fff;--shadow:rgba(5,10,60,.5);--rim1:#3a4ab5;--rim2:#2e3b9c;--rim3:#27338f}
.frame{padding:8px;border-radius:18px;background:var(--rim2);box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 10px 24px var(--shadow)}

.over#menu{background:rgba(14,22,90,.86);overflow:hidden}
.menu{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;animation:pop .55s ease-out}
.logo span{display:block;font-size:60px;font-weight:800;line-height:.95;letter-spacing:1px;background:linear-gradient(180deg,#fff7a8,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,20,90,.65));animation:bob 2.4s ease-in-out infinite}
.logo span+span{background:linear-gradient(180deg,#b8fff0,#38b6ff);-webkit-background-clip:text;background-clip:text;animation-delay:.25s}
.mpanel{width:min(300px,84vw);box-sizing:border-box;padding:12px 16px 8px;border-radius:20px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;gap:2px;text-align:left}
.mpanel .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:17px}
.mpanel .mh .sw{width:56px;height:32px;border-radius:16px}.mpanel .mh .sw::after{top:4px;left:4px;width:24px;height:24px}.mpanel .mh .sw:checked::after{transform:translateX(24px)}
.mpanel input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;margin:0;width:100%;transition:opacity .2s}

.mpanel input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,#2fb7ff var(--p,50%),rgba(255,255,255,.25) var(--p,50%))}
.mpanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid #2fb7ff;box-shadow:0 2px 6px rgba(0,0,0,.4)}

.mbest{font-weight:800;font-size:24px;color:#ffd93d}
.play.big{font-size:28px;padding:16px 62px;border-radius:24px;animation:pulse 1.5s ease-in-out infinite}
.fb{position:absolute;bottom:0;border-radius:8px;opacity:.55;animation:rise linear infinite;box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(0,0,0,.25)}
.seg{display:flex;gap:6px}.seg button{border:0;padding:8px 14px;border-radius:10px;font:700 14px Rubik,system-ui,sans-serif;background:rgba(150,165,225,.3);color:inherit;cursor:pointer}.seg .on{background:#38d97a;color:#fff}
@keyframes drop2{0%{transform:scale(calc(1 + .45*var(--a,1)));filter:brightness(1.8)}30%{transform:scale(calc(1 - .2*var(--a,1)),calc(1 - .12*var(--a,1)));filter:brightness(1.3)}55%{transform:scale(calc(1 + .09*var(--a,1)),calc(1 + .03*var(--a,1)))}80%{transform:scale(.98)}100%{transform:none;filter:none}}

.b1{--k:#ff2f55}.b2{--k:#ff8a00}.b3{--k:#ffe21a}.b4{--k:#19e06a}.b5{--k:#12b5ff}.b6{--k:#a44bff}.b7{--k:#ff3dbd}

.stabs button.on{background:linear-gradient(145deg,#2fb7ff,#5a7bff);color:#fff;box-shadow:0 3px 0 rgba(0,20,80,.35)}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 14px 12px;-webkit-overflow-scrolling:touch}
.spg{display:none}.spg.on{display:block;animation:fade .25s}
#set .spg .gh{display:none}
#set .spg .grp:first-child{margin-top:4px}
.sfoot{flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,40,.28)}
.sfoot .play{width:100%;margin:0}
#set .play.wide{display:block;width:100%;margin:10px 0 0}
.phint{margin:4px 2px 8px;font-size:13px;opacity:.7}
.plist{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.pcard{display:grid;grid-template-columns:48px 1fr 26px;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;border:0;border-radius:18px;background:rgba(255,255,255,.1);color:inherit;font-family:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:background .2s,transform .1s}
.pcard:active{transform:scale(.98)}
.pcard .pi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:28px;background:rgba(0,0,40,.3)}
.pcard b{display:block;font-size:17px;font-weight:700}
.pcard small{display:block;margin-top:2px;font-size:13px;line-height:1.25;opacity:.7}
.pcard .pchk{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:15px;color:transparent}
.pcard.on{background:linear-gradient(135deg,rgba(56,217,122,.35),rgba(47,183,255,.25));box-shadow:inset 0 0 0 2px #38d97a}
.pcard.on .pchk{background:#38d97a;border-color:#38d97a;color:#fff}
/* ---- skins / themes: bottom sheet with live preview ---- */
#skins{align-items:flex-end;background:transparent;backdrop-filter:none}
#skins .card{width:100%;max-width:460px;box-sizing:border-box;border-radius:26px 26px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));max-height:64vh;max-height:64dvh;display:flex;flex-direction:column;overflow:hidden;animation:sheetUp .35s ease-out}
#skins .card h2{display:none}
#skins .skgrid{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#skins .play{margin-top:10px;width:100%;flex:none}
@keyframes sheetUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
body.skpeek #menu{display:none!important}
.pvbox{flex:none;align-self:center;padding:7px;border-radius:16px;background:linear-gradient(155deg,var(--rim1),var(--rim2) 55%,var(--rim3));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.35);margin-bottom:6px}

/* ===== skin picker: full screen, 75% transparent backdrop, opaque controls ===== */
#skins{align-items:stretch;justify-content:stretch;background:transparent!important;backdrop-filter:none!important}
#skins .card{width:100%;max-width:none;height:100%;max-height:none;border-radius:0;border:0;background:rgba(12,20,66,.25)!important;box-shadow:none!important;padding:max(12px,env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px));animation:fade .25s}
#skins .sk{background:color-mix(in srgb,var(--panel),#fff 12%)}
#skins .seg button{background:color-mix(in srgb,var(--panel),#fff 16%)}#skins .seg button.on{background:#38d97a}

#skins .sk{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 3px 0 rgba(0,0,40,.25)}
#skins .sk .pv{padding:6px;border-radius:11px;background:var(--board);border:3px solid var(--rim2);box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}

#music .card{width:min(94vw,420px);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;padding:18px 14px 14px}
#music h2{margin:0 0 10px}#mList{display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;margin-bottom:12px;text-align:left}

<script>
(()=>{
const $=s=>document.querySelector(s);
const board=$('#board'),frame=$('#frame'),lights=$('#lights'),tray=$('#tray'),slots=[...tray.children],sc=$('#score'),cmb=$('#combo');
const COL=['','#ff2f55','#ff8a00','#ffe21a','#19e06a','#12b5ff','#a44bff','#ff3dbd'];
const S={master:.8,sfx:.55,music:.3,sound:true,musicOn:true,vib:false,snap:1,anim:.08,fx:.05,sens:.255,spack:'keys',track:'0',sPitch:.5,sDecay:.5,sBright:.55,sRev:.15,sRand:.2,mRev:.4,mTempo:.5,v_pick:.6,v_tick:.4,v_place:.67,v_spawn:.5,v_clear:.75,v_bad:.5,v_over:.55,muteAll:false,help:1.5,hv:2,rot:false,shape:'st',shk:.05,flash:true,gloss:1,gap:.2,link:false,cc:false,cols:{},pack:'classic',skin:'bevel',lang:null};
let lp,vo,grid,pieces,score=0,shown=0,tw=0,best=0,startBest=0,combo=0,miss=0,lock=false,clrTok=0,drag=null,ac,mg,sg,ug,rv,sr,mr,noise,mt,nextT=0,stp=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('bb-set3')||'{}'));best=+localStorage.getItem('bb-best')||0}catch(e){}
S.anim=Math.max(.05,S.anim);
const save=()=>{try{localStorage.setItem('bb-set3',JSON.stringify(S))}catch(e){}};
if(S.hv!==2){S.help=1.5;S.hv=2;save()}S.help=Math.max(0,Math.min(3,+S.help||0));
const vib=p=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
const rnd=n=>Math.floor(Math.random()*n);
$('#best').textContent=best;if(!S.lang)S.lang=/^ru/i.test(navigator.language)?'ru':'en';
const cells=[];
for(let i=0;i<64;i++){const d=document.createElement('div');d.className='c';board.appendChild(d);cells.push(d)}
for(let s=0;s<4;s++)for(let i=0;i<11;i++){const t=i/11,b=document.createElement('div');b.className='bulb';
  b.style.left=[t,1,1-t,0][s]*100+'%';b.style.top=[0,t,1,1-t][s]*100+'%';b.style.animationDelay=(s*11+i)*60+'ms';lights.appendChild(b)}

/* shapes */
const base=[["1"],["11"],["111"],["1111"],["11111"],["11","11"],["111","111","111"],["111","111"],["10","11"],["100","100","111"],["111","010"],["011","110"],["110","011"],["10","10","11"],["01","01","11"]];
const rot=m=>m[0].map((_,c)=>m.map(r=>r[c]).reverse());
const groups=base.map(b=>{let m=b.map(r=>[...r].map(Number)),out=[],seen=new Set();
  for(let k=0;k<4;k++){const key=JSON.stringify(m);if(!seen.has(key)){seen.add(key);out.push(m)}m=rot(m)}return out});
const can=(m,r,c)=>{for(let i=0;i<m.length;i++)for(let j=0;j<m[i].length;j++)if(m[i][j]){
  const a=r+i,b=c+j;if(a<0||b<0||a>7||b>7||grid[a][b])return false}return true};
const fits=m=>{for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(can(m,r,c))return true;return false};
let dl=0;const wg=(g,f)=>{const o=grid;grid=g;try{return f()}finally{grid=o}};
function solv(g,rest){if(!rest.length||performance.now()>dl)return true;return rest.some((m,ix)=>{const r2=rest.filter((_,j)=>j!==ix);
  return wg(g,()=>{for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(can(m,r,c)){const n=g.map(x=>x.slice());m.forEach((row,i)=>row.forEach((v,j)=>{if(v)n[r+i][c+j]=1}));
    const R=[],C=[];for(let a=0;a<8;a++){if(n[a].every(Boolean))R.push(a);if(n.every(x=>x[a]))C.push(a)}
    R.forEach(a=>n[a].fill(0));C.forEach(a=>n.forEach(x=>x[a]=0));if(solv(n,r2))return true}return false})})}
const ok=(p,t)=>{if(t>=25)return p.some(x=>fits(x.m));dl=performance.now()+35;return solv(grid,p.map(x=>x.m))};
const cnt=m=>m.reduce((a,r)=>a+r.reduce((x,y)=>x+y,0),0);
const lineHit=m=>{for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(can(m,r,c)){const n=grid.map(x=>x.slice());m.forEach((row,i)=>row.forEach((v,j)=>{if(v)n[r+i][c+j]=1}));
  for(let a=0;a<8;a++)if(n[a].every(Boolean)||n.every(x=>x[a]))return true}return false};
const bigIdx=groups.map((g,i)=>cnt(g[0])>=5?i:-1).filter(i=>i>=0);
function newPieces(){const fill=grid.flat().filter(Boolean).length/64,sc=[];
  const wts=groups.map(g=>{const n=cnt(g[0]);return 1+(fill>.35?Math.max(0,6-n)*fill*2.5:0)+(fill<.2&&n>=5?.6:0)});
  const tw=wts.reduce((a,b)=>a+b,0),pick=()=>{let x=Math.random()*tw,i=0;while(i<wts.length-1&&(x-=wts[i])>0)i++;return i};
  const H=[];groups.forEach((g,gi)=>g.forEach(m=>{if(lineHit(m))H.push({m,gi})}));
  const helpP=Math.min(.95,(.3+fill*.6+(miss>=2?.25:0))*S.help),bigP=combo>=2?Math.min(.8,.05+.15*combo):0;
  for(let t=0;t<16;t++){const ks=[1,2,3,4,5,6,7].sort(()=>Math.random()-.5),p=[0,1,2].map(q=>{const gi=Math.random()<bigP?bigIdx[rnd(bigIdx.length)]:pick(),g=groups[gi];return{m:g[rnd(g.length)],k:ks[q],gi}});
    if(H.length&&Math.random()<helpP){const h=H[rnd(H.length)],q=rnd(3);p[q]={m:h.m,k:p[q].k,gi:h.gi}}
    let s=new Set(p.map(x=>x.gi)).size*1.5+Math.random()*2;p.forEach(x=>{if(!fits(x.m))s-=4;else{if(lineHit(x.m))s+=3+(miss>=3?4:0);if(bigP&&cnt(x.m)>=5)s+=1.5*bigP*2}});
    if(fill>.5&&combo<2&&p.reduce((a,x)=>a+cnt(x.m),0)>12)s-=3;sc.push({p,s})}
  sc.sort((a,b)=>b.s-a.s);
  const t0=performance.now();for(let i=0;i<6&&performance.now()-t0<30;i++){dl=performance.now()+10;if(solv(grid,sc[i].p.map(x=>x.m))){pieces=sc[i].p;return}}
  pieces=sc[0].p}

/* audio */
function mkIR(len,dec){const n=Math.floor(ac.sampleRate*len),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let y=0;for(let i=0;i<n;i++){const x=(Math.random()*2-1)*Math.pow(1-i/n,dec);y+=(x-y)*.35;d[i]=y}}return b}
function vol(){if(!ac)return;const t=ac.currentTime;
  mg.gain.setTargetAtTime(S.sound&&!S.muteAll?S.master:0,t,.03);sg.gain.setTargetAtTime(S.sfx,t,.03);ug.gain.setTargetAtTime(S.musicOn?S.music*.55:0,t,.1);
  lp.frequency.setTargetAtTime(Math.min(18000,500*2**(S.sBright*5.3)),t,.03);
  sr.gain.setTargetAtTime(S.sRev*.9,t,.05);mr.gain.setTargetAtTime(.2+S.mRev*.8,t,.1)}
let EV=1,PW;
function audio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();
    mg=ac.createGain();sg=ac.createGain();ug=ac.createGain();lp=ac.createBiquadFilter();lp.type='lowpass';
    rv=ac.createConvolver();rv.buffer=mkIR(2.6,2.4);sr=ac.createGain();mr=ac.createGain();
    sg.connect(lp);lp.connect(mg);sg.connect(sr);sr.connect(rv);ug.connect(mg);ug.connect(mr);mr.connect(rv);rv.connect(mg);mg.connect(ac.destination);
    noise=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    PW=ac.createPeriodicWave(new Float32Array(10),Float32Array.from([0,1,.52,.3,.17,.1,.07,.04,.025,.015]));
    vol()}catch(e){ac=null;return}}
  if(ac.state==='suspended')ac.resume();
  if(!mt){nextT=ac.currentTime+.1;mt=setInterval(mus,120)}}
/* sfx primitives: all honour pitch / decay / randomness / per-event volume */
const kP=()=>2**((S.sPitch-.5)*2),kD=()=>2**((S.sDecay-.5)*3),hm=()=>(Math.random()-.5)*S.sRand;
function tn(f,t=0,d=.15,type='sine',v=.15,f2,a=.004){if(!ac)return;v*=EV;if(v<.002)return;
  const k=kP()*(1+hm()*.05),s=ac.currentTime+t+Math.abs(hm())*.006,D=d*kD(),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f*k,s);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2*k),s+D);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+a+D);
  o.connect(g);g.connect(sg);o.start(s);o.stop(s+a+D+.05)}
function nz(t=0,d=.05,v=.2,ft='bandpass',f=2000,q=1,f2){if(!ac)return;v*=EV;if(v<.002)return;
  const k=kP(),s=ac.currentTime+t+Math.abs(hm())*.006,D=d*kD(),b=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  b.buffer=noise;b.loop=true;fl.type=ft;fl.Q.value=q;fl.frequency.setValueAtTime(f*k,s);if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(20,f2*k),s+D);
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+D);b.connect(fl);fl.connect(g);g.connect(sg);b.start(s,Math.random()*.1);b.stop(s+D+.02)}
function fm(f,r,idx,t=0,d=.6,v=.15){if(!ac)return;v*=EV;if(v<.002)return;
  const k=kP()*(1+hm()*.04),s=ac.currentTime+t+Math.abs(hm())*.006,D=d*kD(),o=ac.createOscillator(),m=ac.createOscillator(),mq=ac.createGain(),g=ac.createGain();
  o.frequency.value=f*k;m.frequency.value=f*k*r;mq.gain.setValueAtTime(idx*f*k,s);mq.gain.exponentialRampToValueAtTime(Math.max(1,f*k*.02),s+D*.5);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.004);g.gain.exponentialRampToValueAtTime(.0001,s+D);
  m.connect(mq);mq.connect(o.frequency);o.connect(g);g.connect(sg);o.start(s);m.start(s);o.stop(s+D+.05);m.stop(s+D+.05)}
function pl(f,t=0,d=.5,v=.2,type='sawtooth'){if(!ac)return;v*=EV;if(v<.002)return;
  const k=kP()*(1+hm()*.05),s=ac.currentTime+t+Math.abs(hm())*.006,D=d*kD(),o=ac.createOscillator(),fl=ac.createBiquadFilter(),g=ac.createGain();
  o.type=type;o.frequency.value=f*k;fl.type='lowpass';fl.Q.value=2;fl.frequency.setValueAtTime(Math.min(12000,f*k*9),s);fl.frequency.exponentialRampToValueAtTime(f*k*1.3,s+D*.5);
